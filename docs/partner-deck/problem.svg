<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F57C00" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFB74D" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="pGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="pGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" rx="24" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="60" y="52" font-family="Inter,sans-serif" font-weight="700" font-size="22" fill="#fff" letter-spacing="-0.5">The Problem</text>

  <!-- User -->
  <g transform="translate(420, 90)">
    <rect x="-40" y="-40" width="80" height="80" rx="40" fill="url(#pGrad2)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="0" cy="-10" r="14" fill="rgba(255,255,255,0.2)"/>
    <ellipse cx="0" cy="20" rx="22" ry="16" fill="rgba(255,255,255,0.12)"/>
    <text x="0" y="62" font-family="Inter,sans-serif" font-weight="600" font-size="13" fill="#fff" text-anchor="middle">User</text>
  </g>

  <!-- Platforms -->
  <g transform="translate(60, 190)">
    <rect x="0" y="0" width="140" height="60" rx="14" fill="#1a1a1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="70" y="26" font-family="Inter,sans-serif" font-weight="600" font-size="13" fill="#fff" text-anchor="middle">Sahibinden</text>
    <text x="70" y="44" font-family="Inter,sans-serif" font-size="10" fill="rgba(255,255,255,0.3)" text-anchor="middle">Search</text>
  </g>
  <g transform="translate(240, 190)">
    <rect x="0" y="0" width="140" height="60" rx="14" fill="#1a1a1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="70" y="26" font-family="Inter,sans-serif" font-weight="600" font-size="13" fill="#fff" text-anchor="middle">Letgo</text>
    <text x="70" y="44" font-family="Inter,sans-serif" font-size="10" fill="rgba(255,255,255,0.3)" text-anchor="middle">Search</text>
  </g>
  <g transform="translate(420, 190)">
    <rect x="0" y="0" width="140" height="60" rx="14" fill="#1a1a1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="70" y="26" font-family="Inter,sans-serif" font-weight="600" font-size="13" fill="#fff" text-anchor="middle">EasyCep</text>
    <text x="70" y="44" font-family="Inter,sans-serif" font-size="10" fill="rgba(255,255,255,0.3)" text-anchor="middle">Search</text>
  </g>
  <g transform="translate(600, 190)">
    <rect x="0" y="0" width="140" height="60" rx="14" fill="#1a1a1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="70" y="26" font-family="Inter,sans-serif" font-weight="600" font-size="13" fill="#fff" text-anchor="middle">Getmobil</text>
    <text x="70" y="44" font-family="Inter,sans-serif" font-size="10" fill="rgba(255,255,255,0.3)" text-anchor="middle">Search</text>
  </g>
  <g transform="translate(760, 190)">
    <rect x="0" y="0" width="90" height="60" rx="14" fill="#1a1a1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="45" y="34" font-family="Inter,sans-serif" font-weight="600" font-size="12" fill="rgba(255,255,255,0.3)" text-anchor="middle">et&nbsp;cetera</text>
  </g>

  <!-- Arrows from user to platforms -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="4,4" fill="none">
    <path d="M420 150 Q 200 150 130 178"/>
    <path d="M420 150 Q 380 150 310 178"/>
    <path d="M420 150 L 490 178"/>
    <path d="M420 150 Q 540 150 670 178"/>
    <path d="M420 150 Q 600 150 800 178"/>
  </g>

  <!-- Arrow down to result -->
  <g transform="translate(420, 280)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <polygon points="0,28 -5,20 5,20" fill="rgba(255,255,255,0.08)"/>
  </g>

  <!-- Result: Fragmented -->
  <g transform="translate(240, 310)">
    <rect x="0" y="0" width="360" height="60" rx="14" fill="rgba(245,60,60,0.08)" stroke="rgba(245,60,60,0.2)" stroke-width="1"/>
    <text x="180" y="26" font-family="Inter,sans-serif" font-weight="600" font-size="14" fill="#f55" text-anchor="middle">Fragmented Results</text>
    <text x="180" y="46" font-family="Inter,sans-serif" font-size="11" fill="rgba(245,60,60,0.5)" text-anchor="middle">Compare prices manually across 5+ tabs</text>
  </g>

  <!-- Time indicator -->
  <g transform="translate(700, 320)">
    <circle cx="16" cy="16" r="16" fill="rgba(245,60,60,0.1)" stroke="rgba(245,60,60,0.15)" stroke-width="1"/>
    <text x="16" y="20" font-family="Inter,sans-serif" font-weight="700" font-size="14" fill="#f55" text-anchor="middle">!</text>
    <text x="16" y="44" font-family="Inter,sans-serif" font-weight="600" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="middle">30-45 min</text>
  </g>
</svg>
